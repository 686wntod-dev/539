name: 539 R3 Official Source Audit
on:
  workflow_dispatch:
  push:
    branches: [replay-ci-v1]
    paths:
      - "gpt_rebuild/replay_bundle.zip"
      - "gpt_rebuild/replay/audit_official_sources.py"
permissions:
  contents: read
  actions: read
jobs:
  official-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Governance preflight — block duplicate 300-draw audit
        run: >-
          python governance/preflight.py
          --problem-id R3-API-AUDIT-300-20261126-RUN3
          --action rerun
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify immutable bundle SHA-256
        run: |
          echo "02fd9ff8b17f2eaa57d1b29dcec45a09f789d810b8a6aba7bf068666ebc7d17a  gpt_rebuild/replay_bundle.zip" | sha256sum --check
      - name: Query official Taiwan Lottery API and reconcile 300 draws
        run: python gpt_rebuild/replay/audit_official_sources.py
      - name: Upload official source audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3-300-official-source-audit
          path: gpt_rebuild/replay/official_source_audit/
          if-no-files-found: warn
          retention-days: 90
