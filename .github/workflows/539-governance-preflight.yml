name: 539 Governance Preflight

on:
  pull_request:
    paths:
      - "governance/**"
      - ".github/workflows/539-governance-preflight.yml"
  push:
    branches:
      - main
      - governance-dedup-v1
    paths:
      - "governance/**"
      - ".github/workflows/539-governance-preflight.yml"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate unique acceptance index and duplicate guards
        run: python governance/preflight.py --self-test
      - name: Validate default execution preflight
        run: python governance/preflight.py
