name: 539 Cleanroom Replay CI

on:
  push:
    branches: [replay-ci-v1]
    paths:
      - "gpt_rebuild/replay/**"
      - "gpt_rebuild/replay_bundle.zip"
      - "gpt_rebuild/requirements-replay.txt"
  pull_request:
    paths:
      - "gpt_rebuild/replay/**"
      - "gpt_rebuild/replay_bundle.zip"
      - "gpt_rebuild/requirements-replay.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanroom-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Governance preflight — block duplicate accepted replay execution
        run: >-
          python governance/preflight.py
          --problem-id CI-CLEANROOM-REPLAY-20261126-RUN19
          --action replay-ci
          --execution-ref "${{ github.sha }}"
          --code-blob-sha "$(git rev-parse HEAD:gpt_rebuild/replay/validate_rebuild.py)"
          --bundle-blob-sha "$(git rev-parse HEAD:gpt_rebuild/replay_bundle.zip)"
      - name: Require the SHA-locked replay bundle
        run: |
          test -s gpt_rebuild/replay_bundle.zip || {
            echo "::error::Missing gpt_rebuild/replay_bundle.zip. Upload the exact SHA-locked 1.22 MB Cleanroom bundle before replay."
            exit 1
          }
      - name: Verify exact replay bundle SHA-256
        run: echo "02fd9ff8b17f2eaa57d1b29dcec45a09f789d810b8a6aba7bf068666ebc7d17a  gpt_rebuild/replay_bundle.zip" | sha256sum --check -
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: gpt_rebuild/requirements-replay.txt
      - name: Install pinned replay environment
        run: python -m pip install -r gpt_rebuild/requirements-replay.txt
      - name: Extract immutable replay bundle
        run: |
          rm -rf gpt_rebuild/replay_bundle_contents
          mkdir -p gpt_rebuild/replay_bundle_contents
          unzip -q gpt_rebuild/replay_bundle.zip -d gpt_rebuild/replay_bundle_contents
      - name: Execute all 12 historical lock replays
        env:
          539_REPLAY_BUNDLE_ROOT: gpt_rebuild/replay_bundle_contents
        run: python gpt_rebuild/replay/validate_rebuild.py
      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 539-cleanroom-replay-evidence
          path: |
            gpt_rebuild/replay_bundle_contents/validation_output/validation_result.json
          if-no-files-found: warn
          retention-days: 90
