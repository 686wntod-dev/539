name: 539 Cleanroom Replay CI

on:
  push:
    branches: [replay-ci-v1]
    paths:
      - "gpt_rebuild/replay/**"
      - "gpt_rebuild/replay_bundle.zip"
      - "gpt_rebuild/requirements-replay.txt"
  pull_request:
    paths:
      - "gpt_rebuild/replay/**"
      - "gpt_rebuild/replay_bundle.zip"
      - "gpt_rebuild/requirements-replay.txt"
  workflow_dispatch:

concurrency:
  group: 539-cleanroom-replay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cleanroom-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restrict manual replay to the canonical replay branch
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/replay-ci-v1'
        run: |
          echo "::error::Manual Cleanroom replay is only permitted from replay-ci-v1."
          exit 1
      - name: Governance preflight — block duplicate accepted replay execution
        run: >-
          python governance/preflight.py
          --problem-id CI-CLEANROOM-REPLAY-20261126-RUN19
          --action replay-ci
          --execution-ref "${{ github.sha }}"
          --code-blob-sha "$(git rev-parse HEAD:gpt_rebuild/replay/validate_rebuild.py)"
          --requirements-blob-sha "$(git rev-parse HEAD:gpt_rebuild/requirements-replay.txt)"
          --bundle-blob-sha "$(git rev-parse HEAD:gpt_rebuild/replay_bundle.zip)"
      - name: Require the SHA-locked replay bundle
        run: |
          test -s gpt_rebuild/replay_bundle.zip || {
            echo "::error::Missing gpt_rebuild/replay_bundle.zip. Upload the exact SHA-locked 1.22 MB Cleanroom bundle before replay."
            exit 1
          }
      - name: Verify exact replay bundle SHA-256
        run: echo "02fd9ff8b17f2eaa57d1b29dcec45a09f789d810b8a6aba7bf068666ebc7d17a  gpt_rebuild/replay_bundle.zip" | sha256sum --check -
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: gpt_rebuild/requirements-replay.txt
      - name: Install pinned replay environment
        run: python -m pip install -r gpt_rebuild/requirements-replay.txt
      - name: Extract immutable replay bundle
        run: |
          rm -rf gpt_rebuild/replay_bundle_contents
          mkdir -p gpt_rebuild/replay_bundle_contents
          unzip -q gpt_rebuild/replay_bundle.zip -d gpt_rebuild/replay_bundle_contents
      - name: Execute all 12 historical lock replays
        env:
          539_REPLAY_BUNDLE_ROOT: gpt_rebuild/replay_bundle_contents
        run: python gpt_rebuild/replay/validate_rebuild.py
      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 539-cleanroom-replay-evidence
          path: gpt_rebuild/replay_bundle_contents/validation_output/validation_result.json
          if-no-files-found: warn
          retention-days: 90

  append-replay-ledger:
    needs: cleanroom-replay
    if: ${{ needs.cleanroom-replay.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Append successful replay fingerprint
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EXECUTION_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python governance/record_replay.py \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --execution-ref "$EXECUTION_SHA" \
            --validator-blob-sha "$(git rev-parse HEAD:gpt_rebuild/replay/validate_rebuild.py)" \
            --requirements-blob-sha "$(git rev-parse HEAD:gpt_rebuild/requirements-replay.txt)" \
            --bundle-blob-sha "$(git rev-parse HEAD:gpt_rebuild/replay_bundle.zip)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add governance/replay_fingerprint_ledger.jsonl
          git commit -m "chore(governance): append successful replay fingerprint"
          git push origin "HEAD:$REF_NAME"
